<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATools — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter Tight", system-ui, sans-serif;
      background: #F4F4F2;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4E3DD;
      border-radius: 18px;
      padding: 44px 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 32px -12px rgba(20,18,15,.13), 0 2px 8px -2px rgba(20,18,15,.06);
    }
    .logo {
      font-size: 30px; font-weight: 800; color: #1F1F25;
      letter-spacing: -.02em; margin-bottom: 4px;
    }
    .logo span { color: #E5511C; }
    .sub { font-size: 13px; color: #76746B; margin-bottom: 32px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #4A4A50;
      margin-bottom: 5px; letter-spacing: .01em; }
    .pwd-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 11px 40px 11px 13px;
      border: 1px solid #E4E3DD; border-radius: 8px;
      font-size: 13.5px; color: #1F1F25; background: #FAFAF7;
      font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: #E5511C;
      box-shadow: 0 0 0 3px rgba(229,81,28,.13);
    }
    .eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #8A8985; padding: 4px; line-height: 1;
      font-size: 15px; opacity: .7; transition: opacity .12s;
    }
    .eye:hover { opacity: 1; }
    .btn {
      width: 100%; padding: 13px;
      background: #E5511C; color: #fff;
      border: none; border-radius: 9px;
      font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: filter .15s, transform .08s;
      margin-top: 6px; letter-spacing: -.005em;
    }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { background: #C7C5BA; cursor: not-allowed; filter: none; transform: none; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 9px; font-size: 13px; line-height: 1.45; }
    .msg.error   { background: #FEF0EE; border: 1px solid #F5C4BB; color: #B7322B; }
    .msg.success { background: #EDFAF3; border: 1px solid #A3D9BA; color: #1D6B3E; font-weight: 500; }
    .section { display: none; }
    .section.visible { display: block; }
    .divider { height: 1px; background: #EEEDE7; margin: 24px 0; }
    .footer { text-align: center; font-size: 11.5px; color: #8A8985; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GA<span>Tools</span></div>
    <div class="sub">Property Sets Manager · Civil 3D</div>

    <!-- Form reset -->
    <div id="sec-form" class="section">
      <div class="field">
        <label for="pwd">Nuova password</label>
        <div class="pwd-wrap">
          <input type="password" id="pwd" placeholder="Minimo 8 caratteri" autocomplete="new-password" />
          <button class="eye" type="button" onclick="togglePwd('pwd',this)" tabindex="-1">👁</button>
        </div>
      </div>
      <div class="field">
        <label for="pwd2">Conferma password</label>
        <div class="pwd-wrap">
          <input type="password" id="pwd2" placeholder="Ripeti la password" autocomplete="new-password" />
          <button class="eye" type="button" onclick="togglePwd('pwd2',this)" tabindex="-1">👁</button>
        </div>
      </div>
      <button class="btn" id="btn" onclick="doReset()">Imposta nuova password</button>
      <div id="msg"></div>
    </div>

    <!-- Link non valido -->
    <div id="sec-invalid" class="section">
      <div class="msg error">Link non valido o scaduto.<br>Richiedi un nuovo link dall'app GATools.</div>
    </div>

    <!-- Successo -->
    <div id="sec-ok" class="section">
      <div class="msg success">✓ Password aggiornata con successo!<br><br>Puoi tornare all'app GATools e accedere con la nuova password.</div>
    </div>

    <div class="footer">GATools · Gabriele Antinucci</div>
  </div>

  <script>
    var SUPABASE_URL  = "https://basrzgzuxwgxyiryppje.supabase.co";
    var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" +
      ".eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhc3J6Z3p1eHdneHlpcnlwcGplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjM0ODYsImV4cCI6MjA5NDkzOTQ4Nn0" +
      ".UF63djR4I3GY8ZN-1LT0boNHggTuNtPmoojQ_5mfD-M";

    var accessToken = null;

    function parseHash() {
      var hash = window.location.hash.replace(/^#/, "");
      var params = {};
      hash.split("&").forEach(function(p) {
        var i = p.indexOf("=");
        if (i > 0) params[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1));
      });
      return params;
    }

    (function init() {
      var p = parseHash();
      if (p.type === "recovery" && p.access_token) {
        accessToken = p.access_token;
        show("sec-form");
      } else {
        show("sec-invalid");
      }
    })();

    function show(id) {
      ["sec-form","sec-invalid","sec-ok"].forEach(function(s) {
        document.getElementById(s).className = "section" + (s === id ? " visible" : "");
      });
    }

    function showMsg(text, type) {
      var el = document.getElementById("msg");
      el.textContent = text;
      el.className = "msg " + type;
    }

    function clearMsg() {
      var el = document.getElementById("msg");
      el.textContent = "";
      el.className = "";
    }

    function togglePwd(id, btn) {
      var inp = document.getElementById(id);
      if (inp.type === "password") { inp.type = "text"; btn.textContent = "🙈"; }
      else { inp.type = "password"; btn.textContent = "👁"; }
    }

    async function doReset() {
      clearMsg();
      var pwd  = document.getElementById("pwd").value;
      var pwd2 = document.getElementById("pwd2").value;
      var btn  = document.getElementById("btn");

      if (pwd.length < 8) { showMsg("La password deve essere di almeno 8 caratteri.", "error"); return; }
      if (pwd !== pwd2)   { showMsg("Le due password non coincidono.", "error"); return; }

      btn.disabled = true;
      btn.textContent = "Aggiornamento in corso…";

      try {
        var resp = await fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON,
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({ password: pwd })
        });

        if (resp.ok) {
          show("sec-ok");
        } else {
          var data = await resp.json();
          var err = data.error_description || data.msg || data.error || "Errore imprevisto.";
          showMsg(err, "error");
          btn.disabled = false;
          btn.textContent = "Imposta nuova password";
        }
      } catch(e) {
        showMsg("Errore di rete. Verifica la connessione e riprova.", "error");
        btn.disabled = false;
        btn.textContent = "Imposta nuova password";
      }
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && document.getElementById("sec-form").classList.contains("visible")) doReset();
    });
  </script>
</body>
</html>
